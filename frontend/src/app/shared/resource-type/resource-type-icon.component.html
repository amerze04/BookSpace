@switch (type()) {
  @case ('Room') {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.6" />
      <path d="M9 4v16M9 12h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
    </svg>
  }
  @case ('Equipment') {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M14.7 6.3a3 3 0 0 1-4 4L5 16l3 3 5.7-5.7a3 3 0 0 1 4-4l-2 2-1.4-1.4 2-2Z"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linejoin="round"
      />
    </svg>
  }
  @case ('Vehicle') {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M5 16v-3.5L7 8h10l2 4.5V16M5 16a1.5 1.5 0 0 0 3 0M16 16a1.5 1.5 0 0 0 3 0M5 16h14"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  }
  @case ('LabSlot') {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M10 3h4M10 3v6l-5 9a1.5 1.5 0 0 0 1.3 2.2h11.4A1.5 1.5 0 0 0 19 18l-5-9V3"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  }
  @default {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.6" />
      <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6" />
    </svg>
  }
}
