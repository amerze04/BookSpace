# Hardening pass — item 13. Mirrors backend-ci.yml's shape and triggers, for
# the half of this repo it left uncovered: until now the frontend had a real
# Vitest suite (44 tests as of this pass, WP-6) and a production build, but
# nothing ran either automatically. This runs both on every push/PR, from a
# clean `npm ci` — no in-place `npm install`, so a missing or drifted
# package-lock.json fails the build here instead of only on a fresh machine.
#
# Recommended branch protection (cannot be set from this file, same caveat as
# backend-ci.yml): require the "frontend" job below as a required status
# check on `main` and `dev`, alongside "backend".
name: Frontend CI

on:
  push:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Production build
        run: npm run build
